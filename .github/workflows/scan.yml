name: Scan freelancer.in

on:
  schedule:
    # GitHub's minimum interval is every 5 minutes; jobs can start a few minutes late.
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: freelancer-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run one scan
        env:
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WA_PHONE_ID: ${{ secrets.WA_PHONE_ID }}
          WA_TO: ${{ secrets.WA_TO }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MAX_BIDS: "16"
          MIN_HOURLY: "5"
          MIN_FIXED: "0"
          WORTH: "0"
          SCAN_TIMEOUT_SEC: "420"
          TZ: Asia/Kolkata
        run: python pipeline.py --once

      - name: Commit state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in seen_ids.txt state.json shortlist.jsonl new_matches.csv scanner.log; do
            [ -f "$f" ] && git add -- "$f"
          done
          if git diff --cached --quiet; then
            echo "No state changes"
            exit 0
          fi
          git commit -m "scan: update state [skip ci]"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then
              exit 0
            fi
            echo "push failed, retry ${i}"
            git rebase --abort 2>/dev/null || true
            sleep $((i * 2))
          done
          echo "failed to push state after retries"
          exit 1
